swagger: '2.0'
info:
  title: Argent Bank API - Transactions (phase 2)
  description: |
    Proposed API endpoints for the **Transactions** feature (phase 2).

    Features covered:
    - view all transactions of the current month, grouped by account;
    - view the details of a transaction in a separate view;
    - add, modify or delete information on a transaction (category and notes).
      Transactions themselves are never created or deleted through this API.

    All endpoints require a valid JWT token (obtained with `POST /user/login`),
    sent in the `Authorization` header as `Bearer <token>`.
    A user can only access their own accounts and transactions.
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
security:
  - Bearer: []
tags:
  - name: Accounts Module
    description: Accounts of the logged-in user
  - name: Transactions Module
    description: Transactions of an account and their editable information
paths:
  /user/accounts:
    get:
      tags:
        - Accounts Module
      summary: Get the user's accounts
      description: >-
        Returns all the accounts of the logged-in user with their current balance.
        Each account is the entry point to its transactions, which is how
        transactions are grouped by account.
      responses:
        '200':
          description: Accounts retrieved successfully
          schema:
            $ref: '#/definitions/AccountsResponse'
        '401':
          description: Missing, invalid or expired token
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 401
              message: 'Token is missing from header'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 500
              message: 'Internal Server Error'

  /user/accounts/{accountId}/transactions:
    get:
      tags:
        - Transactions Module
      summary: Get the transactions of an account for a month
      description: >-
        Returns the account summary (name, balance) and the list of its
        transactions for the requested month, sorted by date (most recent first).
        Without the `month` parameter, the current month is returned.
      parameters:
        - $ref: '#/parameters/AccountId'
        - in: query
          name: month
          description: >-
            Month to retrieve, in the `YYYY-MM` format.
            Optional: defaults to the current month.
          required: false
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          x-example: '2020-06'
        - in: query
          name: category
          description: Optional filter to only return the transactions of this category
          required: false
          type: string
          enum:
            - Food
            - Transport
            - Shopping
            - Housing
            - Health
            - Leisure
            - Other
      responses:
        '200':
          description: Transactions retrieved successfully
          schema:
            $ref: '#/definitions/TransactionsResponse'
        '400':
          description: Invalid parameter (wrong month format or unknown category)
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 400
              message: 'Invalid month format, expected YYYY-MM'
        '401':
          description: Missing, invalid or expired token
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 401
              message: 'Token is missing from header'
        '404':
          description: Account not found (or it does not belong to the user)
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 404
              message: 'Account not found'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 500
              message: 'Internal Server Error'

  /user/accounts/{accountId}/transactions/{transactionId}:
    get:
      tags:
        - Transactions Module
      summary: Get the details of a transaction
      description: >-
        Returns all the details of a transaction, including its type,
        category and notes, to be displayed in a separate view.
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
      responses:
        '200':
          description: Transaction retrieved successfully
          schema:
            $ref: '#/definitions/TransactionResponse'
        '401':
          description: Missing, invalid or expired token
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 401
              message: 'Token is missing from header'
        '404':
          description: Account or transaction not found (or not owned by the user)
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 404
              message: 'Transaction not found'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 500
              message: 'Internal Server Error'
    patch:
      tags:
        - Transactions Module
      summary: Add or modify the information of a transaction
      description: >-
        Adds or modifies the category and/or the notes of a transaction.
        Only the fields sent in the body are updated; the other fields
        (date, description, amount, balance, type) cannot be modified.
        Returns the updated transaction.
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
        - in: body
          name: body
          description: Information to add or modify (at least one field)
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
      responses:
        '200':
          description: Transaction information updated successfully
          schema:
            $ref: '#/definitions/TransactionResponse'
          examples:
            application/json:
              status: 200
              message: 'Transaction updated successfully'
              body:
                id: '6ab4ef18e5380e28790855d7'
                accountId: '6ab4ef18e5380e28790855c1'
                date: '2020-06-20T10:30:00.000Z'
                description: 'Golden Sun Bakery'
                amount: -5.00
                balance: 2082.79
                type: Electronic
                category: Food
                notes: 'Birthday cake for Pepper'
        '400':
          description: >-
            Invalid fields (empty body, unknown category, notes longer
            than 250 characters, or attempt to modify a read-only field)
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 400
              message: 'Invalid category'
        '401':
          description: Missing, invalid or expired token
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 401
              message: 'Token is missing from header'
        '404':
          description: Account or transaction not found (or not owned by the user)
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 404
              message: 'Transaction not found'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 500
              message: 'Internal Server Error'

  /user/accounts/{accountId}/transactions/{transactionId}/category:
    delete:
      tags:
        - Transactions Module
      summary: Delete the category of a transaction
      description: >-
        Removes the category of a transaction (it becomes `null`).
        The transaction itself is not deleted. Returns the updated transaction.
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
      responses:
        '200':
          description: Category deleted successfully
          schema:
            $ref: '#/definitions/TransactionResponse'
          examples:
            application/json:
              status: 200
              message: 'Category deleted successfully'
              body:
                id: '6ab4ef18e5380e28790855d7'
                accountId: '6ab4ef18e5380e28790855c1'
                date: '2020-06-20T10:30:00.000Z'
                description: 'Golden Sun Bakery'
                amount: -5.00
                balance: 2082.79
                type: Electronic
                category: null
                notes: 'Birthday cake for Pepper'
        '401':
          description: Missing, invalid or expired token
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 401
              message: 'Token is missing from header'
        '404':
          description: Account or transaction not found, or the transaction has no category
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 404
              message: 'Transaction not found'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 500
              message: 'Internal Server Error'

  /user/accounts/{accountId}/transactions/{transactionId}/notes:
    delete:
      tags:
        - Transactions Module
      summary: Delete the notes of a transaction
      description: >-
        Removes the notes of a transaction (they become `null`).
        The transaction itself is not deleted. Returns the updated transaction.
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
      responses:
        '200':
          description: Notes deleted successfully
          schema:
            $ref: '#/definitions/TransactionResponse'
          examples:
            application/json:
              status: 200
              message: 'Notes deleted successfully'
              body:
                id: '6ab4ef18e5380e28790855d7'
                accountId: '6ab4ef18e5380e28790855c1'
                date: '2020-06-20T10:30:00.000Z'
                description: 'Golden Sun Bakery'
                amount: -5.00
                balance: 2082.79
                type: Electronic
                category: Food
                notes: null
        '401':
          description: Missing, invalid or expired token
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 401
              message: 'Token is missing from header'
        '404':
          description: Account or transaction not found, or the transaction has no notes
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 404
              message: 'Transaction not found'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              status: 500
              message: 'Internal Server Error'

parameters:
  AccountId:
    in: path
    name: accountId
    description: ID of the account
    required: true
    type: string
    x-example: '6ab4ef18e5380e28790855c1'
  TransactionId:
    in: path
    name: transactionId
    description: ID of the transaction
    required: true
    type: string
    x-example: '6ab4ef18e5380e28790855d7'

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: 'JWT token, as `Bearer <token>`'

definitions:
  Account:
    type: object
    properties:
      id:
        type: string
        example: '6ab4ef18e5380e28790855c1'
      name:
        type: string
        description: Name of the account
        example: 'Argent Bank Checking'
      accountNumber:
        type: string
        description: Masked account number (last 4 digits)
        example: 'x8349'
      type:
        type: string
        enum:
          - checking
          - savings
          - credit
        example: checking
      balance:
        type: number
        format: double
        description: Current balance of the account
        example: 2082.79
      balanceLabel:
        type: string
        description: Label displayed under the balance
        example: 'Available Balance'
      currency:
        type: string
        example: USD

  Transaction:
    type: object
    properties:
      id:
        type: string
        example: '6ab4ef18e5380e28790855d7'
      accountId:
        type: string
        example: '6ab4ef18e5380e28790855c1'
      date:
        type: string
        format: date-time
        example: '2020-06-20T10:30:00.000Z'
      description:
        type: string
        example: 'Golden Sun Bakery'
      amount:
        type: number
        format: double
        description: Amount of the transaction (negative for a debit)
        example: -5.00
      balance:
        type: number
        format: double
        description: Balance of the account right after this transaction
        example: 2082.79
      type:
        type: string
        description: Transaction type (read-only)
        example: Electronic
      category:
        type: string
        description: Category chosen by the user (can be null)
        enum:
          - Food
          - Transport
          - Shopping
          - Housing
          - Health
          - Leisure
          - Other
        example: Food
      notes:
        type: string
        description: Free notes added by the user (can be null)
        example: 'Birthday cake for Pepper'

  TransactionUpdate:
    type: object
    description: Editable information of a transaction (at least one field)
    minProperties: 1
    properties:
      category:
        type: string
        enum:
          - Food
          - Transport
          - Shopping
          - Housing
          - Health
          - Leisure
          - Other
        example: Food
      notes:
        type: string
        maxLength: 250
        example: 'Birthday cake for Pepper'

  AccountsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: 'Accounts retrieved successfully'
      body:
        type: array
        items:
          $ref: '#/definitions/Account'

  TransactionsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: 'Transactions retrieved successfully'
      body:
        type: object
        properties:
          account:
            $ref: '#/definitions/Account'
          month:
            type: string
            description: Month of the returned transactions (YYYY-MM)
            example: '2020-06'
          transactions:
            type: array
            items:
              $ref: '#/definitions/Transaction'

  TransactionResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: 'Transaction retrieved successfully'
      body:
        $ref: '#/definitions/Transaction'

  ErrorResponse:
    type: object
    properties:
      status:
        type: integer
        example: 404
      message:
        type: string
        example: 'Transaction not found'
